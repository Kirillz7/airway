<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D62839">
  <meta name="color-scheme" content="light dark">
  <title>AIRWAY — симулятор первой помощи</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚑</text></svg>">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Внешние библиотеки (Графики и скриншоты) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Стили -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="modal-root"></div>

  <!-- Утилиты -->
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/sound.js"></script>
  <script src="js/utils/theme.js"></script>
  <script src="js/utils/i18n.js"></script>
  <script src="js/utils/lang.js"></script>

  <!-- Данные -->
  <script src="js/data/cases.js"></script>
  <script src="js/data/library.js"></script>

  <!-- Ядро приложения -->
  <script src="js/core/state.js"></script>
  <script src="js/core/timer.js"></script>
  <script src="js/core/router.js"></script>

  <!-- UI компоненты -->
  <script src="js/ui/components.js"></script>
  <script src="js/ui/feedback.js"></script>

  <!-- Экраны (с обновленной версией для сброса кэша) -->
  <script src="js/ui/screens.js?v=7"></script>

  <!-- Firebase и модули (ES Modules) -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/game.js"></script>

  <script type="module" src="js/ui/auth.js"></script>
  <script type="module" src="js/ui/profile.js"></script>
  <script type="module" src="js/ui/edit-profile.js"></script>
  <script type="module" src="js/ui/leaderboard.js"></script>
  <script type="module" src="js/ui/teacher.js"></script>
  <script type="module" src="js/ui/admin.js"></script>
  <script type="module" src="js/ui/user-public.js"></script>
  <script type="module" src="js/ui/debrief.js"></script>

  <!-- Новые фичи -->
  <script type="module" src="js/ui/attempts.js"></script>
  <script type="module" src="js/ui/onboarding.js"></script>
  <script type="module" src="js/ui/challenge.js"></script>

  <!-- Точка входа -->
  <script type="module" src="js/app.js"></script>

  <!-- Библиотека для экспорта в PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Регистрация Service Worker (для PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
    }
  </script>
</body>
</html>
